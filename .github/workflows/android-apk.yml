# Gera o app Android (APK) do Rotina.ai e publica num link fixo:
# https://github.com/brendamelo-collab/approtina.ai/releases/download/android-latest/rotina-ai.apk
# O app abre o site (que se atualiza sozinho); o APK só precisa ser reinstalado quando o alarme nativo muda.
name: App Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      # Chave de assinatura: vem dos secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD.
      # Sem eles, usa uma chave temporária (o app instala, mas cada nova versão exige desinstalar a anterior).
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/rotina.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASS"
          else
            echo "::warning::Secrets ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD ausentes: usando chave temporária."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias rotinaai \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rotina.ai, O=Rotina.ai, C=BR"
          fi
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Adicionar alarme nativo, ícones e assinatura
        run: python3 patch_android.py

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rotina-ai.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "App Android do Rotina.ai" \
              --notes "Baixe rotina-ai.apk no celular Android e instale. Atualizado automaticamente a cada mudança no app nativo." --latest=false
          gh release upload android-latest rotina-ai.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: rotina-ai-apk
          path: android-app/rotina-ai.apk
