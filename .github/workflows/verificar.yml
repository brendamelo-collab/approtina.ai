# Confere as alterações feitas em outras branches antes de irem para a main:
# checa os tipos, gera a versão final (sem publicar) e uma versão de pré-visualização para testes,
# e compila o app Android (sem publicar o APK).
name: Verificar alterações

on:
  push:
    branches-ignore: [main, verificacao-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Checar tipos (TypeScript)
        run: npx tsc --noEmit 2>&1 | tee tsc.log; echo "exit=${PIPESTATUS[0]}" >> tsc.log
        shell: bash

      - name: Gerar versão final (não publica)
        run: npm run build

      - name: Gerar pré-visualização para testes
        run: npx vite build --config tools/preview/vite.preview.config.ts

      # Guarda a pré-visualização numa branch separada (verificacao-preview) para os testes automáticos.
      - name: Publicar pré-visualização na branch verificacao-preview
        env:
          SRC_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/pv && cp -r tools/preview/dist/. /tmp/pv/ && cp tsc.log /tmp/pv/
          cd /tmp/pv
          git init -q -b verificacao-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Pré-visualização de $SRC_BRANCH ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" verificacao-preview

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Chave temporária (só para compilar)
        run: |
          KS="$RUNNER_TEMP/verify.keystore"
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias rotinaai \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rotina.ai, O=Rotina.ai, C=BR"
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Adicionar alarme nativo
        run: python3 patch_android.py

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK (não publica)
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon
